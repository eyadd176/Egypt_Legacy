    <form id="contactForm" class="cairo">
      <fieldset class="sphinx">
        <legend class="nile">Contact Us</legend>

        <label for="name" class="dune">Name:</label>
        <input type="text" id="name" dir="auto" class="oasis" />

        <label for="email" class="dune">Email:</label>
        <input type="email" id="email" dir="auto" class="oasis" />

        <p class="ankh">Choose The Reason</p>

        <div class="scarab">
          <input
            type="radio"
            id="Booking"
            name="Reason"
            value="Booking"
            onchange="toggleTextarea()"
          />
          <label for="Booking" class="papyrus">Booking Issue</label>

          <input
            type="radio"
            id="Payment"
            name="Reason"
            value="Payment"
            onchange="toggleTextarea()"
          />
          <label for="Payment" class="papyrus">Payment Issue</label>

          <input
            type="radio"
            id="Refund"
            name="Reason"
            value="Refund"
            onchange="toggleTextarea()"
          />
          <label for="Refund" class="papyrus">Returns & Refunds</label>

          <input
            type="radio"
            id="Bug"
            name="Reason"
            value="Bug"
            onchange="toggleTextarea()"
          />
          <label for="Bug" class="papyrus">Report a Bug</label>

          <input
            type="radio"
            id="Other"
            name="Reason"
            value="Other"
            onchange="toggleTextarea()"
          />
          <label for="Other" class="papyrus">Other</label>
        </div>

        <textarea
          id="otherText"
          class="lotus"
          dir="auto"
          disabled
          placeholder="Please describe your issue..."
        ></textarea>

        <button class="pharaoh" type="button" onclick="validateForm()">
          Submit
        </button>
      </fieldset>
    </form>
